apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fraud-detection-service-accounts
  namespace: argocd
  labels:
    app.kubernetes.io/name: service-accounts
    app.kubernetes.io/part-of: fraud-detection-demo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: https://github.com/your-org/fraud-detection-gitops  # Replace with your Git repository
    path: manifests/service-accounts
    targetRevision: HEAD
  
  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10

  info:
    - name: 'Description'
      value: 'Service accounts with IRSA for fraud detection applications'