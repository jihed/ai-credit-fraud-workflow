# Ray cluster configuration for fraud detection ML workloads
# Optimized for distributed training and inference

# Ray cluster configuration
image:
  repository: rayproject/ray-ml
  tag: "2.8.0-py310"
  pullPolicy: IfNotPresent

# Head node configuration
head:
  rayStartParams:
    dashboard-host: '0.0.0.0'
    dashboard-port: '8265'
    port: '6379'
    object-manager-port: '8076'
    node-manager-port: '8077'
    gcs-server-port: '8078'
    min-worker-port: '10002'
    max-worker-port: '19999'
    redis-password: 'fraud-detection-ray'  # Change in production
  
  # Head node resources
  resources:
    limits:
      cpu: 4
      memory: 16Gi
    requests:
      cpu: 2
      memory: 8Gi
  
  # Service configuration for dashboard and client access
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"  # Internal for security
    ports:
      - name: client
        port: 10001
        protocol: TCP
        targetPort: 10001
      - name: dashboard
        port: 8265
        protocol: TCP
        targetPort: 8265
      - name: gcs-server
        port: 8078
        protocol: TCP
        targetPort: 8078
  
  # Node selector for head node (prefer system nodes)
  nodeSelector:
    NodeGroupType: system
  
  # Tolerations for system nodes
  tolerations:
    - key: system
      operator: Equal
      value: "true"
      effect: NoSchedule

# Worker node configuration
worker:
  # Number of worker groups
  groupName: fraud-detection-workers
  replicas: 2
  minReplicas: 1
  maxReplicas: 10
  
  rayStartParams:
    port: '6379'
    object-manager-port: '8076'
    node-manager-port: '8077'
    min-worker-port: '10002'
    max-worker-port: '19999'
    redis-password: 'fraud-detection-ray'  # Change in production
  
  # Worker resources (CPU-optimized for general ML workloads)
  resources:
    limits:
      cpu: 8
      memory: 32Gi
    requests:
      cpu: 4
      memory: 16Gi
  
  # Node selector for workers (prefer compute-optimized nodes)
  nodeSelector:
    provisioner: spark-cpu-optimized
  
  # Additional worker groups for different workload types
  additionalWorkerGroups:
    # GPU workers for RAPIDS and GPU-accelerated training
    gpu-workers:
      replicas: 0  # Start with 0, scale up when needed
      minReplicas: 0
      maxReplicas: 4
      
      rayStartParams:
        port: '6379'
        object-manager-port: '8076'
        node-manager-port: '8077'
        min-worker-port: '10002'
        max-worker-port: '19999'
        redis-password: 'fraud-detection-ray'
      
      resources:
        limits:
          cpu: 16
          memory: 64Gi
          nvidia.com/gpu: 1
        requests:
          cpu: 8
          memory: 32Gi
          nvidia.com/gpu: 1
      
      nodeSelector:
        provisioner: spark-gpu-rapids
        nvidia.com/gpu: "true"
      
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
    
    # Memory-optimized workers for large datasets
    memory-workers:
      replicas: 1
      minReplicas: 0
      maxReplicas: 3
      
      rayStartParams:
        port: '6379'
        object-manager-port: '8076'
        node-manager-port: '8077'
        min-worker-port: '10002'
        max-worker-port: '19999'
        redis-password: 'fraud-detection-ray'
      
      resources:
        limits:
          cpu: 16
          memory: 128Gi
        requests:
          cpu: 8
          memory: 64Gi
      
      nodeSelector:
        provisioner: spark-memory-optimized

# Service account configuration
serviceAccount:
  create: true
  name: ray-cluster-sa
  annotations:
    eks.amazonaws.com/role-arn: ""  # Will be populated with IRSA role for S3 access

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Ray Serve configuration (for inference)
serve:
  enabled: true
  
# Monitoring and observability
monitoring:
  enabled: true
  
  # Prometheus metrics
  prometheus:
    enabled: true
    port: 8080
    path: /metrics
  
  # Grafana dashboard
  grafana:
    enabled: false  # Can be enabled if Grafana is deployed

# Security configuration
security:
  # Network policies
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                name: jupyterhub
          - namespaceSelector:
              matchLabels:
                name: ray-system
    egress:
      - to: []  # Allow all egress for S3 access
  
  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  
  # Container security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false  # Ray needs write access
    capabilities:
      drop:
        - ALL

# Storage configuration
storage:
  # Persistent volume for Ray logs and temporary data
  enabled: true
  size: 50Gi
  storageClass: gp3
  accessMode: ReadWriteOnce

# Environment variables for fraud detection
env:
  - name: RAY_DISABLE_IMPORT_WARNING
    value: "1"
  - name: RAY_DEDUP_LOGS
    value: "0"
  - name: PYTHONPATH
    value: "/home/ray/fraud_detection:/home/ray"
  - name: AWS_DEFAULT_REGION
    value: "us-west-2"  # Should match your deployment region

# Custom labels
labels:
  app.kubernetes.io/name: ray-cluster
  app.kubernetes.io/component: fraud-detection
  app.kubernetes.io/part-of: fraud-detection-demo

# Annotations
annotations:
  deployment.kubernetes.io/revision: "1"