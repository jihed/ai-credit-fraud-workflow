apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: emr-to-eks-migration
  namespace: argocd
  labels:
    app.kubernetes.io/name: emr-to-eks-migration
    app.kubernetes.io/part-of: emr-to-eks-migration
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: emr-to-eks-migration
  source:
    repoURL: https://github.com/your-org/emr-to-eks-migration.git
    targetRevision: HEAD
    path: emr-spark-rapids/gitops/argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  info:
    - name: Description
      value: App of Apps for EMR to EKS Migration Platform
    - name: Environment
      value: production
    - name: Team
      value: Platform Engineering
    - name: Documentation
      value: https://github.com/your-org/emr-to-eks-migration/blob/main/README.md