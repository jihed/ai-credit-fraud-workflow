hub:
  config:
    JupyterHub:
      authenticator_class: dummy
    DummyAuthenticator:
      password: "fraud-detection-demo"
    Authenticator:
      admin_users:
        - admin
        - data-scientist
        - ml-engineer
  
  extraConfig:
    myConfig: |
      # Enable GPU access for notebooks
      c.KubeSpawner.extra_resource_limits = {"nvidia.com/gpu": "1"}
      c.KubeSpawner.extra_resource_guarantees = {"nvidia.com/gpu": "1"}
      
      # Configure node selector for GPU nodes
      c.KubeSpawner.node_selector = {"nvidia.com/gpu": "true"}
      
      # Add tolerations for GPU nodes
      c.KubeSpawner.tolerations = [
        {
          "key": "nvidia.com/gpu",
          "operator": "Exists",
          "effect": "NoSchedule"
        }
      ]
      
      # Set environment variables for EMR and Ray connectivity
      c.KubeSpawner.environment = {
        "EMR_VIRTUAL_CLUSTER_ID": "${emr_virtual_cluster_id}",
        "EMR_EXECUTION_ROLE_ARN": "${emr_execution_role_arn}",
        "RAY_ADDRESS": "ray://ray-cluster-head-svc.ray-system.svc.cluster.local:10001",
        "AWS_DEFAULT_REGION": "${aws_region}",
        "S3_BUCKET": "${s3_bucket_name}"
      }

  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"

singleuser:
  # Use custom image with RAPIDS, EMR, and Ray libraries
  image:
    name: ${account_id}.dkr.ecr.${aws_region}.amazonaws.com/jupyterhub-rapids
    tag: "latest"
    pullPolicy: Always
  
  # Resource configuration
  cpu:
    limit: 4
    guarantee: 2
  memory:
    limit: 16G
    guarantee: 8G
  
  # GPU configuration
  extraResource:
    limits:
      nvidia.com/gpu: "1"
    guarantees:
      nvidia.com/gpu: "1"
  
  # Storage configuration
  storage:
    type: dynamic
    capacity: 20Gi
    homeMountPath: /home/jovyan
    dynamic:
      storageClass: gp2
      pvcNameTemplate: claim-{username}{servername}
      volumeNameTemplate: volume-{username}{servername}
      storageAccessModes: [ReadWriteOnce]
  
  # Additional volumes for shared data
  extraVolumes:
    - name: shared-data
      persistentVolumeClaim:
        claimName: jupyterhub-shared-data
  
  extraVolumeMounts:
    - name: shared-data
      mountPath: /shared
  
  # Node selector and tolerations for GPU nodes
  nodeSelector:
    nvidia.com/gpu: "true"
  
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  
  # Service account with necessary permissions
  serviceAccountName: jupyterhub-notebook-sa
  
  # Lifecycle hooks for notebook initialization
  lifecycleHooks:
    postStart:
      exec:
        command:
          - "/bin/bash"
          - "-c"
          - |
            # Create notebook templates directory
            mkdir -p /home/jovyan/templates
            
            # Copy notebook templates
            cp -r /opt/templates/* /home/jovyan/templates/
            
            # Set permissions
            chown -R jovyan:jovyan /home/jovyan/templates

  # Default URL for new users
  defaultUrl: "/lab"

# Proxy configuration
proxy:
  secretToken: "${jupyterhub_secret_token}"
  service:
    type: ClusterIP

# Scheduling configuration
scheduling:
  userScheduler:
    enabled: true
    replicas: 1
  podPriority:
    enabled: true
  userPlaceholder:
    enabled: true
    replicas: 2

# Culling configuration
cull:
  enabled: true
  timeout: 3600  # 1 hour
  every: 600     # 10 minutes
  maxAge: 28800  # 8 hours

# Ingress configuration
ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internal"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
  hosts:
    - jupyterhub.${cluster_name}.local
  tls:
    - secretName: jupyterhub-tls
      hosts:
        - jupyterhub.${cluster_name}.local