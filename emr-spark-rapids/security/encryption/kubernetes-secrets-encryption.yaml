# Kubernetes secrets encryption configuration
# This is applied at the EKS cluster level

# KMS Key for Kubernetes secrets encryption
resource "aws_kms_key" "fraud_detection_k8s_secrets" {
  description             = "KMS key for Kubernetes secrets encryption"
  deletion_window_in_days = 7
  enable_key_rotation     = true

  policy = jsonencode({
    Version = "2012-10-17"
    Statement = [
      {
        Sid    = "Enable IAM User Permissions"
        Effect = "Allow"
        Principal = {
          AWS = "arn:aws:iam::${data.aws_caller_identity.current.account_id}:root"
        }
        Action   = "kms:*"
        Resource = "*"
      },
      {
        Sid    = "Allow EKS service"
        Effect = "Allow"
        Principal = {
          Service = "eks.amazonaws.com"
        }
        Action = [
          "kms:Decrypt",
          "kms:GenerateDataKey"
        ]
        Resource = "*"
      }
    ]
  })

  tags = {
    Name        = "fraud-detection-k8s-secrets-key"
    Environment = var.environment
    Purpose     = "Kubernetes secrets encryption"
  }
}

# KMS Key Alias
resource "aws_kms_alias" "fraud_detection_k8s_secrets" {
  name          = "alias/fraud-detection-k8s-secrets"
  target_key_id = aws_kms_key.fraud_detection_k8s_secrets.key_id
}

# EKS cluster with secrets encryption
resource "aws_eks_cluster" "cluster" {
  name     = var.cluster_name
  role_arn = aws_iam_role.cluster.arn
  version  = var.cluster_version

  vpc_config {
    subnet_ids              = var.subnet_ids
    endpoint_private_access = true
    endpoint_public_access  = true
    public_access_cidrs     = var.cluster_endpoint_public_access_cidrs
  }

  encryption_config {
    provider {
      key_arn = aws_kms_key.fraud_detection_k8s_secrets.arn
    }
    resources = ["secrets"]
  }

  enabled_cluster_log_types = [
    "api",
    "audit",
    "authenticator",
    "controllerManager",
    "scheduler"
  ]

  depends_on = [
    aws_iam_role_policy_attachment.cluster_AmazonEKSClusterPolicy,
    aws_cloudwatch_log_group.cluster
  ]

  tags = {
    Name        = var.cluster_name
    Environment = var.environment
  }
}

# Secure secret for database credentials
apiVersion: v1
kind: Secret
metadata:
  name: fraud-detection-db-credentials
  namespace: fraud-detection
  annotations:
    kubernetes.io/description: "Database credentials for fraud detection service"
type: Opaque
data:
  username: ${DB_USERNAME_BASE64}
  password: ${DB_PASSWORD_BASE64}
  host: ${DB_HOST_BASE64}
---
# Secure secret for model artifacts access
apiVersion: v1
kind: Secret
metadata:
  name: model-artifacts-credentials
  namespace: inference
  annotations:
    kubernetes.io/description: "S3 credentials for model artifacts access"
type: Opaque
data:
  aws-access-key-id: ${AWS_ACCESS_KEY_ID_BASE64}
  aws-secret-access-key: ${AWS_SECRET_ACCESS_KEY_BASE64}
  s3-bucket: ${S3_BUCKET_BASE64}