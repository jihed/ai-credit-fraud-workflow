# Cert-manager ClusterIssuer for internal CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
# Root CA Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fraud-detection-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: fraud-detection-ca
  secretName: fraud-detection-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# CA ClusterIssuer
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: fraud-detection-ca-issuer
spec:
  ca:
    secretName: fraud-detection-ca-secret
---
# EMR Spark Driver Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: emr-spark-driver-tls
  namespace: ml-team-a
spec:
  secretName: emr-spark-driver-tls
  issuerRef:
    name: fraud-detection-ca-issuer
    kind: ClusterIssuer
  commonName: emr-spark-driver.ml-team-a.svc.cluster.local
  dnsNames:
  - emr-spark-driver.ml-team-a.svc.cluster.local
  - emr-spark-driver.ml-team-a.svc
  - emr-spark-driver
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: emr-spark-driver-tls
  namespace: ml-team-b
spec:
  secretName: emr-spark-driver-tls
  issuerRef:
    name: fraud-detection-ca-issuer
    kind: ClusterIssuer
  commonName: emr-spark-driver.ml-team-b.svc.cluster.local
  dnsNames:
  - emr-spark-driver.ml-team-b.svc.cluster.local
  - emr-spark-driver.ml-team-b.svc
  - emr-spark-driver
---
# Ray Head Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ray-head-tls
  namespace: ray-system
spec:
  secretName: ray-head-tls
  issuerRef:
    name: fraud-detection-ca-issuer
    kind: ClusterIssuer
  commonName: ray-head.ray-system.svc.cluster.local
  dnsNames:
  - ray-head.ray-system.svc.cluster.local
  - ray-head.ray-system.svc
  - ray-head
---
# Inference Service Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fraud-inference-tls
  namespace: inference
spec:
  secretName: fraud-inference-tls
  issuerRef:
    name: fraud-detection-ca-issuer
    kind: ClusterIssuer
  commonName: fraud-inference.inference.svc.cluster.local
  dnsNames:
  - fraud-inference.inference.svc.cluster.local
  - fraud-inference.inference.svc
  - fraud-inference