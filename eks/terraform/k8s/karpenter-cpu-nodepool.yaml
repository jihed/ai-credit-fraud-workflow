apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: cpu-ml-workloads
  labels:
    workload-type: cpu
spec:
  template:
    metadata:
      labels:
        workload-type: cpu
        NodeGroupType: spark-driver-cpu-karpenter
      annotations:
        node.kubernetes.io/instance-type: "m5.xlarge"
    spec:
      requirements:
        - key: "karpenter.k8s.aws/instance-family"
          operator: In
          values: ["m5", "m5a", "m5n"]
        - key: "karpenter.k8s.aws/instance-size"
          operator: In
          values: ["xlarge", "2xlarge", "4xlarge", "8xlarge"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot", "on-demand"]
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: cpu-ml-workloads
  limits:
    cpu: 1000
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
    expireAfter: 720h
---
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: cpu-ml-workloads
  labels:
    workload-type: cpu
spec:
  amiFamily: AL2
  role: ${node_role}
  subnetSelectorTerms:
    - id: ${subnet_id}
  securityGroupSelectorTerms:
    - tags:
        Name: ${cluster_name}-node
  instanceStorePolicy: RAID0
  userData: |
    #!/bin/bash
    /etc/eks/bootstrap.sh ${cluster_name}
    
    # Configure NVMe volumes in RAID0 configuration
    export LOCAL_DISKS='raid0'
    
    # Optimize for CPU workloads
    echo 'vm.swappiness=1' >> /etc/sysctl.conf
    echo 'net.core.somaxconn=65535' >> /etc/sysctl.conf
    sysctl -p
  tags:
    Name: ${cluster_name}-cpu-node
    NodeType: cpu-ml-workloads
    Environment: production