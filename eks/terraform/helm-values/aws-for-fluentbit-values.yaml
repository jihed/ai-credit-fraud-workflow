# AWS for Fluent Bit Enhanced Configuration
# Optimized for EMR to EKS migration monitoring

image:
  repository: public.ecr.aws/aws-observability/aws-for-fluent-bit
  tag: "2.32.2"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  parsersFiles:
    - /fluent-bit/parsers/parsers.conf
  extraParsers: |
    [PARSER]
        Name        emr_spark
        Format      regex
        Regex       ^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) (?<level>[A-Z]+) (?<logger>[^\s]+): (?<message>.*)$
        Time_Key    time
        Time_Format %Y-%m-%d %H:%M:%S,%L

    [PARSER]
        Name        ray_log
        Format      regex
        Regex       ^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) (?<level>[A-Z]+) (?<component>[^\s]+) (?<pid>\d+) (?<message>.*)$
        Time_Key    time
        Time_Format %Y-%m-%d %H:%M:%S,%L

    [PARSER]
        Name        fraud_inference
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L

  extraFiles:
    application-log.conf: |
      [INPUT]
          Name                tail
          Tag                 application.*
          Exclude_Path        /var/log/containers/cloudwatch-agent*, /var/log/containers/fluent-bit*, /var/log/containers/aws-node*, /var/log/containers/kube-proxy*
          Path                /var/log/containers/*.log
          multiline.parser    docker, cri
          DB                  /var/fluent-bit/state/flb_container.db
          Mem_Buf_Limit       50MB
          Skip_Long_Lines     On
          Refresh_Interval    10
          Rotate_Wait         30
          storage.type        filesystem
          Read_from_Head      Off

      [INPUT]
          Name                tail
          Tag                 application.emr.*
          Path                /var/log/containers/*emr*.log, /var/log/containers/*spark*.log
          multiline.parser    docker, cri
          DB                  /var/fluent-bit/state/flb_emr.db
          Mem_Buf_Limit       50MB
          Skip_Long_Lines     On
          Refresh_Interval    10
          storage.type        filesystem
          Read_from_Head      Off

      [INPUT]
          Name                tail
          Tag                 application.ray.*
          Path                /var/log/containers/*ray*.log
          multiline.parser    docker, cri
          DB                  /var/fluent-bit/state/flb_ray.db
          Mem_Buf_Limit       50MB
          Skip_Long_Lines     On
          Refresh_Interval    10
          storage.type        filesystem
          Read_from_Head      Off

      [INPUT]
          Name                tail
          Tag                 application.inference.*
          Path                /var/log/containers/*fraud-inference*.log
          multiline.parser    docker, cri
          DB                  /var/fluent-bit/state/flb_inference.db
          Mem_Buf_Limit       50MB
          Skip_Long_Lines     On
          Refresh_Interval    10
          storage.type        filesystem
          Read_from_Head      Off

      [FILTER]
          Name                kubernetes
          Match               application.*
          Kube_URL            https://kubernetes.default.svc:443
          Kube_Tag_Prefix     application.var.log.containers.
          Merge_Log           On
          Merge_Log_Key       log_processed
          K8S-Logging.Parser  On
          K8S-Logging.Exclude Off
          Labels              Off
          Annotations         Off
          Use_Kubelet         On
          Kubelet_Port        10250
          Buffer_Size         0

      [FILTER]
          Name                parser
          Match               application.emr.*
          Key_Name            log
          Parser              emr_spark
          Reserve_Data        On

      [FILTER]
          Name                parser
          Match               application.ray.*
          Key_Name            log
          Parser              ray_log
          Reserve_Data        On

      [FILTER]
          Name                parser
          Match               application.inference.*
          Key_Name            log
          Parser              fraud_inference
          Reserve_Data        On

      [OUTPUT]
          Name                cloudwatch_logs
          Match               application.emr.*
          region              ${region}
          log_group_name      /aws/eks/${cluster_name}/emr-containers
          log_stream_prefix   $${HOST_NAME}-
          auto_create_group   true
          extra_user_agent    container-insights

      [OUTPUT]
          Name                cloudwatch_logs
          Match               application.ray.*
          region              ${region}
          log_group_name      /aws/eks/${cluster_name}/ray-training
          log_stream_prefix   $${HOST_NAME}-
          auto_create_group   true
          extra_user_agent    container-insights

      [OUTPUT]
          Name                cloudwatch_logs
          Match               application.inference.*
          region              ${region}
          log_group_name      /aws/eks/${cluster_name}/inference-service
          log_stream_prefix   $${HOST_NAME}-
          auto_create_group   true
          extra_user_agent    container-insights

      [OUTPUT]
          Name                cloudwatch_logs
          Match               application.*
          region              ${region}
          log_group_name      /aws/eks/${cluster_name}/application
          log_stream_prefix   $${HOST_NAME}-
          auto_create_group   true
          extra_user_agent    container-insights

env:
  - name: AWS_REGION
    value: "${region}"
  - name: CLUSTER_NAME
    value: "${cluster_name}"
  - name: HTTP_SERVER
    value: "On"
  - name: HTTP_LISTEN
    value: "0.0.0.0"
  - name: HTTP_PORT
    value: "2020"
  - name: READ_FROM_HEAD
    value: "Off"
  - name: READ_FROM_TAIL
    value: "On"

resources:
  limits:
    memory: 200Mi
  requests:
    cpu: 500m
    memory: 100Mi

nodeSelector:
  kubernetes.io/os: linux

tolerations:
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  - operator: "Exists"
    effect: "NoExecute"
  - operator: "Exists"
    effect: "NoSchedule"

updateStrategy:
  type: RollingUpdate

priorityClassName: system-node-critical

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${account_id}:role/${cluster_name}-fluent-bit-role

rbac:
  create: true

podSecurityPolicy:
  create: false