image:
  repository: quay.io/kuberay/operator
  tag: v1.1.1
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# Operator configuration
operator:
  env: []
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# RBAC configuration
rbac:
  create: true
  apiVersion: v1

serviceAccount:
  create: true
  name: kuberay-operator
  annotations: {}

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 65532

# Pod security context
podSecurityContext:
  fsGroup: 65532

# Node selector for operator placement on core nodes
nodeSelector:
  NodeGroupType: core

# Tolerations for operator placement
tolerations: []

# Affinity for operator placement
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      preference:
        matchExpressions:
        - key: NodeGroupType
          operator: In
          values: ["core"]

# Webhook configuration
webhook:
  create: true
  port: 9443

# Monitoring configuration
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    labels:
      app.kubernetes.io/name: kuberay-operator
    interval: 30s
    scrapeTimeout: 10s

# Logging configuration
logging:
  level: info
  format: json

# Resource quotas and limits
resources:
  limits:
    cpu: 200m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Additional labels for all resources
commonLabels:
  app.kubernetes.io/part-of: ray-cluster
  workload: ml-training
  cluster: ${cluster_name}

# Additional annotations for all resources
commonAnnotations:
  deployment.kubernetes.io/revision: "1"