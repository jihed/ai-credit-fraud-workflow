apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fraud-inference
  namespace: argocd
  labels:
    app.kubernetes.io/name: fraud-inference
    app.kubernetes.io/part-of: emr-to-eks-migration
spec:
  project: emr-to-eks-migration
  source:
    repoURL: https://github.com/your-org/emr-to-eks-migration.git
    targetRevision: HEAD
    path: emr-spark-rapids/gitops/helm-charts/fraud-inference
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: image.tag
          value: "latest"
        - name: replicaCount
          value: "3"
        - name: autoscaling.enabled
          value: "true"
        - name: autoscaling.minReplicas
          value: "3"
        - name: autoscaling.maxReplicas
          value: "20"
        - name: ingress.enabled
          value: "true"
        - name: monitoring.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: fraud-detection
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  info:
    - name: Description
      value: Fraud Detection Inference Service
    - name: Environment
      value: production
    - name: Team
      value: ML Engineering