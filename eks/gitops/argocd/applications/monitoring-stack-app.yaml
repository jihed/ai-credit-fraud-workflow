apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
  labels:
    app.kubernetes.io/name: monitoring-stack
    app.kubernetes.io/part-of: emr-to-eks-migration
spec:
  project: emr-to-eks-migration
  source:
    repoURL: https://github.com/your-org/emr-to-eks-migration.git
    targetRevision: HEAD
    path: emr-spark-rapids/gitops/helm-charts/monitoring-stack
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: kube-prometheus-stack.enabled
          value: "true"
        - name: kubecost.enabled
          value: "true"
        - name: customMetricsExporters.enabled
          value: "true"
        - name: nvidiaDcgmExporter.enabled
          value: "true"
        - name: customRules.enabled
          value: "true"
        - name: customDashboards.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-prometheus-stack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - Replace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Secret
      name: kube-prometheus-stack-grafana
      jsonPointers:
        - /data
  info:
    - name: Description
      value: Comprehensive monitoring stack for EMR to EKS migration
    - name: Environment
      value: production
    - name: Team
      value: Platform Engineering