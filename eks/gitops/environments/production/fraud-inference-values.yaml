# Production environment values for fraud-inference
replicaCount: 3

image:
  repository: fraud-inference
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

ingress:
  enabled: true
  annotations:
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-west-2:ACCOUNT_ID:certificate/CERT_ID"
  hosts:
    - host: fraud-inference.data-on-eks.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: fraud-inference-tls
      hosts:
        - fraud-inference.data-on-eks.com

env:
  - name: MODEL_PATH
    value: "s3://your-prod-bucket/models/fraud-detection/latest/"
  - name: AWS_DEFAULT_REGION
    value: "us-west-2"
  - name: LOG_LEVEL
    value: "INFO"
  - name: WORKERS
    value: "4"

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

podDisruptionBudget:
  enabled: true
  minAvailable: 2

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app.kubernetes.io/name
          operator: In
          values:
          - fraud-inference
      topologyKey: kubernetes.io/hostname

nodeSelector:
  node.kubernetes.io/instance-type: m5.xlarge