# Security Context Constraints for EMR Spark workloads
apiVersion: v1
kind: SecurityContextConstraints
metadata:
  name: emr-spark-scc
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegedContainer: false
allowedCapabilities: []
defaultAddCapabilities: []
requiredDropCapabilities:
- ALL
fsGroup:
  type: MustRunAs
  ranges:
  - min: 1000
  - max: 65535
runAsUser:
  type: MustRunAsNonRoot
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: MustRunAs
  ranges:
  - min: 1000
  - max: 65535
volumes:
- configMap
- downwardAPI
- emptyDir
- persistentVolumeClaim
- projected
- secret
users:
- system:serviceaccount:ml-team-a:emr-spark-driver
- system:serviceaccount:ml-team-a:emr-spark-executor
- system:serviceaccount:ml-team-b:emr-spark-driver
- system:serviceaccount:ml-team-b:emr-spark-executor