# Pod Security Standards for enhanced security
# Apply restricted security standards to all workload namespaces

# Pod Security Policy for ml-team-a
apiVersion: v1
kind: Namespace
metadata:
  name: ml-team-a
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Pod Security Policy for ml-team-b
apiVersion: v1
kind: Namespace
metadata:
  name: ml-team-b
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Pod Security Policy for fraud-detection
apiVersion: v1
