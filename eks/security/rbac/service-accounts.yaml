# EMR on EKS Service Accounts
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emr-spark-driver
  namespace: ml-team-a
  annotations:
    eks.amazonaws.com/role-arn: ${EMR_SPARK_DRIVER_ROLE_ARN}
    eks.amazonaws.com/sts-regional-endpoints: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emr-spark-executor
  namespace: ml-team-a
  annotations:
    eks.amazonaws.com/role-arn: ${EMR_SPARK_EXECUTOR_ROLE_ARN}
    eks.amazonaws.com/sts-regional-endpoints: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emr-spark-driver
