# Spark RAPIDS Configuration for EMR on EKS
# This file contains default Spark configurations for RAPIDS GPU acceleration

# RAPIDS SQL Plugin Configuration
spark.plugins=com.nvidia.spark.SQLPlugin
spark.rapids.sql.enabled=true
spark.rapids.sql.python.gpu.enabled=true

# GPU Resource Configuration
spark.executor.resource.gpu.amount=1
spark.task.resource.gpu.amount=0.25
spark.rapids.sql.concurrentGpuTasks=2

# Memory Configuration for GPU
spark.rapids.memory.pinnedPool.size=2G
spark.rapids.memory.host.spillStorageSize=1G
spark.rapids.sql.batchSizeBytes=512m

# Shuffle and I/O Configuration
spark.rapids.shuffle.enabled=true
spark.rapids.sql.format.parquet.enabled=true
spark.rapids.sql.format.parquet.read.enabled=true
spark.rapids.sql.format.parquet.write.enabled=true

# Performance Tuning
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.adaptive.advisoryPartitionSizeInBytes=128MB
spark.rapids.sql.explain=ALL

# Kubernetes Specific Configuration
spark.kubernetes.executor.annotation.cluster-autoscaler.kubernetes.io/safe-to-evict=false
spark.kubernetes.executor.label.rapids-enabled=true

# Error Handling
spark.rapids.sql.incompatibleOps.enabled=true
spark.rapids.sql.variableFloatAgg.enabled=true