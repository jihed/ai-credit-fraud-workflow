apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: emr-fraud-detection
  name: emr-containers-role
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: emr-containers-rb
  namespace: emr-fraud-detection
subjects:
- kind: ServiceAccount
  name: emr-containers-sa-spark-driver
  namespace: emr-fraud-detection
- kind: ServiceAccount
  name: emr-containers-sa-spark-executor
  namespace: emr-fraud-detection
roleRef:
  kind: Role
  name: emr-containers-role
  apiGroup: rbac.authorization.k8s.io