apiVersion: v1
kind: Pod
metadata:
  name: gpu-test-pod
  namespace: emr-fraud-detection
spec:
  nodeSelector:
    karpenter.sh/nodepool: spark-gpu-rapids
    nvidia.com/gpu: "true"
  tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: "true"
    effect: NoSchedule
  containers:
  - name: gpu-test
    image: nvidia/cuda:11.8-base-ubuntu20.04
    command: ["sleep", "300"]
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
        nvidia.com/gpu: "1"
      limits:
        nvidia.com/gpu: "1"
  restartPolicy: Never