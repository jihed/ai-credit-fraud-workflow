# JupyterHub configuration for fraud detection demo
# This configuration provides different notebook profiles for various workloads

hub:
  # Disable persistent storage for demo
  db:
    type: sqlite-memory
  
  config:
    JupyterHub:
      authenticator_class: 'jupyterhub.auth.DummyAuthenticator'  # For demo only
    DummyAuthenticator:
      password: 'fraud-detection-demo'  # For demo only - use proper auth in production
    
    Spawner:
      default_url: '/lab'
      
  extraEnv:
    # EMR on EKS configuration
    VIRTUAL_CLUSTER_ID: '6rt5ikzzpmyu1u2vp6rqqhmd1'  # Will be populated from Terraform output
    EMR_EXECUTION_ROLE_ARN: 'arn:aws:iam::368083780519:role/fraud-detection-emr-eks-emr-execution-20250806151622744200000001'  # Will be populated from Terraform output
    
    # Ray cluster configuration
    RAY_CLUSTER_ADDRESS: 'ray://ray-cluster-head-svc.ray-system.svc.cluster.local:10001'
    
    # S3 bucket for data
    S3_BUCKET_NAME: 'fraud-detection-emr-eks-emr-20250806141826624700000005'  # Will be populated from Terraform output

  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

singleuser:
  # Default resources for notebook pods
  cpu:
    limit: 2
    guarantee: 1
  memory:
    limit: 4G
    guarantee: 2G
  
  # Storage for user notebooks (using emptyDir for demo)
  storage:
    type: none
    homeMountPath: /home/jovyan
  
  # Service account with IRSA for S3 access
  serviceAccountName: jupyterhub-user-sa
  
  # Profile list for different workload types
  profileList:
    - display_name: "Fraud Detection - Data Processing"
      description: "EMR Spark + RAPIDS for feature engineering (4 CPU, 8GB RAM)"
      default: true
      kubespawner_override:
        image: 'jupyter/pyspark-notebook:spark-3.5.0'
        cpu_limit: 4
        cpu_guarantee: 2
        mem_limit: '8G'
        mem_guarantee: '4G'
        environment:
          SPARK_DRIVER_MEMORY: '4g'
          SPARK_EXECUTOR_MEMORY: '4g'
          VIRTUAL_CLUSTER_ID: '6rt5ikzzpmyu1u2vp6rqqhmd1'  # Populated from environment
          EMR_EXECUTION_ROLE_ARN: 'arn:aws:iam::368083780519:role/fraud-detection-emr-eks-emr-execution-20250806151622744200000001'  # Populated from environment
          
    - display_name: "Fraud Detection - ML Training"
      description: "Ray + XGBoost for distributed training (8 CPU, 16GB RAM)"
      kubespawner_override:
        image: 'rayproject/ray-ml:2.8.0-py310'
        cpu_limit: 8
        cpu_guarantee: 4
        mem_limit: '16G'
        mem_guarantee: '8G'
        environment:
          RAY_ADDRESS: 'ray://ray-cluster-head-svc.ray-system.svc.cluster.local:10001'
          
    - display_name: "Fraud Detection - GPU Accelerated"
      description: "RAPIDS + GPU for accelerated processing (4 CPU, 16GB RAM, 1 GPU)"
      kubespawner_override:
        image: 'rapidsai/rapidsai:23.12-cuda11.8-runtime-ubuntu22.04-py3.10'
        cpu_limit: 4
        cpu_guarantee: 2
        mem_limit: '16G'
        mem_guarantee: '8G'
        extra_resource_limits:
          nvidia.com/gpu: "1"
        extra_resource_guarantees:
          nvidia.com/gpu: "1"
        node_selector:
          nvidia.com/gpu: "true"
        tolerations:
          - key: nvidia.com/gpu
            operator: Equal
            value: "true"
            effect: NoSchedule
            
    - display_name: "Fraud Detection - Unified"
      description: "Both Spark and Ray capabilities (8 CPU, 32GB RAM)"
      kubespawner_override:
        image: 'fraud-detection/unified-notebook:latest'  # Custom image with both Spark and Ray
        cpu_limit: 8
        cpu_guarantee: 4
        mem_limit: '32G'
        mem_guarantee: '16G'
        environment:
          VIRTUAL_CLUSTER_ID: '6rt5ikzzpmyu1u2vp6rqqhmd1'  # Populated from environment
          EMR_EXECUTION_ROLE_ARN: 'arn:aws:iam::368083780519:role/fraud-detection-emr-eks-emr-execution-20250806151622744200000001'  # Populated from environment
          RAY_ADDRESS: 'ray://ray-cluster-head-svc.ray-system.svc.cluster.local:10001'

  # Network policy for security
  networkPolicy:
    enabled: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                name: jupyterhub
    egress:
      - to: []  # Allow all egress for S3, EMR, Ray access

# Proxy configuration
proxy:
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
  
  # HTTPS configuration (optional)
  https:
    enabled: false  # Set to true and configure certificates for production

# Scheduling configuration
scheduling:
  userScheduler:
    enabled: true
    replicas: 1
  
  podPriority:
    enabled: true
    globalDefault: false
    defaultPriority: 0
    userPlaceholderPriority: -10

# Culling configuration to save resources
cull:
  enabled: true
  timeout: 3600  # 1 hour
  every: 600     # Check every 10 minutes
  concurrency: 10
  users: false   # Don't cull named servers
  maxAge: 0      # Don't cull based on age

# Resource quotas should be managed via Kubernetes ResourceQuota objects
# See: https://kubernetes.io/docs/concepts/policy/resource-quotas/