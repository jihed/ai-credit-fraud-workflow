# JupyterHub Service Account with IRSA for S3 access
# This service account will be used by notebook pods to access S3 data
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jupyterhub-user-sa
  namespace: jupyterhub
  annotations:
    # IRSA annotation - will be populated with actual role ARN from Terraform
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/JupyterHub-S3-Access-Role
  labels:
    app: jupyterhub
    component: singleuser-server
---
# ClusterRole for JupyterHub user pods
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jupyterhub-user-role
  labels:
    app: jupyterhub
rules:
# Allow reading ConfigMaps and Secrets for configuration
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
# Allow creating and managing pods for Ray clusters (if needed)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# Allow accessing services for Ray cluster connectivity
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list"]
---
# ClusterRoleBinding for JupyterHub users
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jupyterhub-user-binding
  labels:
    app: jupyterhub
subjects:
- kind: ServiceAccount
  name: jupyterhub-user-sa
  namespace: jupyterhub
roleRef:
  kind: ClusterRole
  name: jupyterhub-user-role
  apiGroup: rbac.authorization.k8s.io