# Persistent storage configuration for JupyterHub
# This provides shared storage for notebooks and data

# StorageClass for EBS volumes
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: jupyterhub-storage
  labels:
    app: jupyterhub
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
# PersistentVolumeClaim for shared notebooks
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyterhub-shared-storage
  namespace: jupyterhub
  labels:
    app: jupyterhub
    component: shared-storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc  # Use EFS for shared access
  resources:
    requests:
      storage: 100Gi
---
# ConfigMap for shared notebooks and examples
apiVersion: v1
kind: ConfigMap
metadata:
  name: jupyterhub-shared-notebooks
  namespace: jupyterhub
  labels:
    app: jupyterhub
    component: shared-notebooks
data:
  README.md: |
    # Fraud Detection Notebooks
    
    This directory contains shared notebooks for the fraud detection demo.
    
    ## Available Notebooks:
    
    1. **01_fraud_detection_feature_engineering.ipynb** - EMR Spark + RAPIDS feature engineering
    2. **02_fraud_detection_training.ipynb** - XGBoost training with Ray or EMR
    3. **03_fraud_detection_inference.ipynb** - Model inference and batch scoring
    
    ## Notebook Profiles:
    
    - **Data Processing**: Use for EMR Spark + RAPIDS workloads
    - **ML Training**: Use for Ray + XGBoost distributed training
    - **GPU Accelerated**: Use for RAPIDS GPU acceleration
    - **Unified**: Use for workflows requiring both Spark and Ray
    
    ## Getting Started:
    
    1. Select the appropriate notebook profile when spawning your server
    2. Upload your data to the configured S3 bucket
    3. Use the provided environment variables for EMR and Ray connectivity
    4. Check the examples in the shared-notebooks directory
    
    ## Environment Variables:
    
    - `VIRTUAL_CLUSTER_ID`: EMR on EKS virtual cluster ID
    - `EMR_EXECUTION_ROLE_ARN`: EMR execution role for job submission
    - `RAY_ADDRESS`: Ray cluster address for distributed computing
    - `S3_BUCKET_NAME`: S3 bucket for data storage
    
    ## Support:
    
    For issues or questions, check the deployment documentation in the eks/helm directory.
  
  example-spark-config.py: |
    # Example Spark configuration for EMR on EKS
    from pyspark.sql import SparkSession
    import os
    
    def create_spark_session():
        """Create Spark session configured for EMR on EKS with RAPIDS"""
        return SparkSession.builder \
            .appName("Fraud Detection - Feature Engineering") \
            .config("spark.kubernetes.container.image", "fraud-detection/spark-rapids:latest") \
            .config("spark.kubernetes.namespace", "emr-fraud-detection") \
            .config("spark.kubernetes.executor.podNamePrefix", "fraud-detection") \
            .config("spark.executor.memory", "30G") \
            .config("spark.executor.cores", "4") \
            .config("spark.executor.instances", "4") \
            .config("spark.sql.shuffle.partitions", "200") \
            .config("spark.rapids.sql.enabled", "true") \
            .config("spark.plugins", "com.nvidia.spark.SQLPlugin") \
            .config("spark.hadoop.fs.s3a.impl", "org.apache.hadoop.fs.s3a.S3AFileSystem") \
            .config("spark.hadoop.fs.s3a.aws.credentials.provider", "com.amazonaws.auth.WebIdentityTokenCredentialsProvider") \
            .getOrCreate()
    
    # Usage
    if __name__ == "__main__":
        spark = create_spark_session()
        
        # Example: Read data from S3
        bucket_name = os.environ.get('S3_BUCKET_NAME', 'your-bucket-name')
        customers_df = spark.read.parquet(f"s3a://{bucket_name}/customers/")
        
        print(f"Loaded {customers_df.count()} customer records")
        spark.stop()
  
  example-ray-config.py: |
    # Example Ray configuration for distributed training
    import ray
    import os
    from ray.train.xgboost import XGBoostTrainer
    from ray.train import ScalingConfig
    
    def connect_to_ray():
        """Connect to Ray cluster"""
        ray_address = os.environ.get('RAY_ADDRESS', 'ray://ray-cluster-head-svc.ray-system.svc.cluster.local:10001')
        ray.init(address=ray_address)
        print(f"Connected to Ray cluster: {ray_address}")
        print(f"Ray cluster resources: {ray.cluster_resources()}")
    
    def create_xgboost_trainer(train_dataset, test_dataset):
        """Create XGBoost trainer for distributed training"""
        return XGBoostTrainer(
            scaling_config=ScalingConfig(
                num_workers=4,
                use_gpu=True,
                resources_per_worker={"GPU": 1, "CPU": 4}
            ),
            datasets={"train": train_dataset, "valid": test_dataset},
            params={
                "tree_method": "gpu_hist",
                "objective": "binary:logistic",
                "eval_metric": ["logloss", "error"],
                "max_depth": 6,
                "learning_rate": 0.1,
                "subsample": 0.8,
                "colsample_bytree": 0.8
            },
            num_boost_round=100
        )
    
    # Usage
    if __name__ == "__main__":
        connect_to_ray()
        
        # Example: Load data and train model
        # train_dataset = ray.data.read_parquet(f"s3://{bucket_name}/train/")
        # test_dataset = ray.data.read_parquet(f"s3://{bucket_name}/test/")
        # trainer = create_xgboost_trainer(train_dataset, test_dataset)
        # result = trainer.fit()
        
        print("Ray configuration example completed")
        ray.shutdown()