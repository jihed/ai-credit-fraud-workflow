# Spark Configuration for Fraud Detection Feature Engineering with RAPIDS
# Optimized for GPU-accelerated processing on EMR on EKS

# RAPIDS Configuration
spark.plugins=com.nvidia.spark.SQLPlugin
spark.shuffle.manager=com.nvidia.spark.rapids.spark350.RapidsShuffleManager
spark.rapids.sql.enabled=true
spark.rapids.sql.concurrentGpuTasks=2
spark.rapids.sql.explain=ALL
spark.rapids.sql.incompatibleOps.enabled=true
spark.rapids.sql.castStringToFloat.enabled=true
spark.rapids.sql.hasNans=false

# RAPIDS Memory Configuration
spark.rapids.memory.pinnedPool.size=2G
spark.rapids.memory.gpu.pool=ASYNC
spark.rapids.memory.gpu.allocFraction=0.6
spark.rapids.memory.gpu.maxAllocFraction=0.8
spark.rapids.shuffle.mode=MULTITHREADED

# Driver Configuration
spark.driver.cores=2
spark.driver.memory=8g
spark.driver.maxResultSize=4g
spark.driver.memoryOverhead=1g

# Executor Configuration
spark.executor.cores=5
spark.executor.memory=26g
spark.executor.memoryOverhead=2g
spark.executor.resource.gpu.vendor=nvidia.com
spark.executor.resource.gpu.amount=1
spark.executor.extraLibraryPath=/usr/local/cuda/lib:/usr/local/cuda/lib64:/usr/local/cuda/extras/CUPTI/lib64:/usr/local/cuda/targets/x86_64-linux/lib:/usr/lib/hadoop/lib/native:/usr/lib/hadooplzo/lib/native

# Task Configuration
spark.task.cpus=1
spark.task.resource.gpu.amount=1

# SQL Optimization
spark.sql.sources.useV1SourceList=parquet
spark.sql.files.maxPartitionBytes=512MB
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true
spark.sql.adaptive.coalescePartitions.minPartitionNum=1
spark.sql.adaptive.coalescePartitions.initialPartitionNum=200
spark.sql.adaptive.advisoryPartitionSizeInBytes=256MB
spark.sql.execution.arrow.maxRecordsPerBatch=200000
spark.sql.shuffle.partitions=200

# Performance Tuning
spark.locality.wait=0s
spark.dynamicAllocation.enabled=false
spark.serializer=org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max=2047m
spark.network.timeout=1600s
spark.executor.heartbeatInterval=60s

# Parquet Optimization
spark.sql.parquet.compression.codec=snappy
spark.sql.parquet.filterPushdown=true
spark.sql.parquet.mergeSchema=false
spark.sql.parquet.writeLegacyFormat=false

# S3 Configuration
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider=com.amazonaws.auth.DefaultAWSCredentialsProviderChain
spark.hadoop.fs.s3a.block.size=134217728
spark.hadoop.fs.s3a.buffer.dir=/tmp
spark.hadoop.fs.s3a.committer.name=magic
spark.hadoop.fs.s3a.committer.magic.enabled=true
spark.hadoop.mapreduce.outputcommitter.factory.scheme.s3a=org.apache.hadoop.fs.s3a.commit.S3ACommitterFactory
spark.hadoop.fs.s3a.connection.maximum=200
spark.hadoop.fs.s3a.threads.max=64
spark.hadoop.fs.s3a.connection.establish.timeout=5000
spark.hadoop.fs.s3a.connection.timeout=200000

# Kubernetes Configuration
spark.kubernetes.executor.podNamePrefix=fraud-detection
spark.kubernetes.executor.deleteOnTermination=true
spark.kubernetes.driver.deleteOnTermination=true

# Logging Configuration
spark.eventLog.enabled=true
spark.eventLog.dir=/tmp/spark-events
spark.history.fs.logDirectory=/tmp/spark-events